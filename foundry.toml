[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read-write", path = "./" }]

[rpc_endpoints]
mezo_testnet = "https://rpc.test.mezo.org"
mezo_mainnet = "https://rpc-http.mezo.boar.network"
base_mainnet = "https://mainnet.base.org"

[etherscan]
mezo_testnet = { key = "empty", url = "https://api.explorer.test.mezo.org/api", chain = 31611 }
mezo_mainnet = { key = "empty", url = "https://api.explorer.mezo.org/api", chain = 31612 }
